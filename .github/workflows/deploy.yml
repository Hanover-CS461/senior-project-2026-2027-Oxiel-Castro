name: Pages deploy
on:
  push:
    branches:
      - main
jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
        working-directory: proposal
      - name: Build the site
        run: bundle exec jekyll build
        working-directory: proposal
      - name: Build slides with Marp CLI
        run: |
          mkdir -p _site/slides
          npx --yes @marp-team/marp-cli@latest slides/slides.md -o _site/slides/slides.html --theme-set slides/rose-pine-moon.css
          ls -la _site/slides
          test -f _site/slides/slides.html
        working-directory: proposal
      - name: Copy slide assets
        run: cp -r slides/assets _site/slides/assets
        working-directory: proposal
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './proposal/_site'
  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4